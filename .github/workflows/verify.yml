# Runs the StudyForge verifier on every lab (solution green, starter red for the
# right reason) on the oldest and newest supported Python, plus the project's
# acceptance: the mutant hunt over the reference suite. About a minute.
name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/verify.py
      - name: Project acceptance (mutant hunt over the reference suite)
        working-directory: labs/01-unit-tests/project-split-bill/acceptance
        run: python -m pytest -q -p no:cacheprovider
