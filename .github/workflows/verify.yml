# Runs the StudyForge verifier on every lab (solution green, starter red for the
# right reason) on the oldest and newest supported Python, plus each project's
# acceptance (the mutant hunt over the reference suite) and the elective 2.5
# against PostgreSQL in Docker. A few minutes.
name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/verify.py
      - name: Project 1.P acceptance (mutant hunt over the reference suite)
        working-directory: labs/01-unit-tests/project-split-bill/acceptance
        run: python -m pytest -q -p no:cacheprovider
      - name: Project 2.P acceptance (mutant hunt over the reference suite)
        working-directory: labs/02-integration-tests/project-expense-import/acceptance
        run: python -m pytest -q -p no:cacheprovider
      # The elective 2.5 needs Docker and its own libraries. verify.py above runs it
      # without them (the PostgreSQL tests skip); here they must run, not skip.
      - name: Elective lab 2.5 against PostgreSQL in Docker
        if: matrix.python == '3.15'
        working-directory: labs/02-integration-tests/05-containers/demo
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pytest -q -p no:cacheprovider -rs | tee pytest.log
          if grep -q SKIPPED pytest.log; then echo "PostgreSQL tests were skipped"; exit 1; fi
